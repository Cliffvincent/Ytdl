<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Download YouTube videos as MP4 or MP3 files.">
	<link rel="icon"
		href="https://cdn0.iconfinder.com/data/icons/flat-round-arrow-arrow-head/512/Red_Arrow_Down-512.png"
		type="image/x-icon">
	<script src="https://cdn.tailwindcss.com"></script>
	<script async src="https://pp.piddu.dev/milk.js" data-ackee-server="https://pp.piddu.dev"
		data-ackee-domain-id="93394347-a467-40b0-bc73-2026eb00e8a4" data-ackee-opts='{"detailed":true}'></script>
	<link rel="stylesheet" href="/style.css">
	<title>YouTube Downloader</title>
</head>

<body>
	<main class="main-container min-h-screen">
		<header class="heading">
			<h1 class="text-white text-7xl font-bold mb-[3%]" id="heading">
				YouTube <span class="text-[#ffcc99]">Downloader</span>
			</h1>
			<p class="text-gray-200" aria-describedby="heading">
				Download your video in MP4 or MP3 format.
			</p>
		</header>

		<section class="forms" aria-labelledby="download-title">
			<h2 id="download-title" class="sr-only">Download a YouTube video</h2>
			<form id="code-submit" onsubmit="return false;" novalidate>
				<div class="container">
					<div class="field">
						<label class="label" for="inp">Video URL</label>
						<input id="inp" autocomplete="url" name="url" type="url"
							placeholder="Enter a YouTube video URL" aria-describedby="url-help" required>
						<small id="url-help" class="text-gray-300">
							Paste a YouTube video link to continue.
						</small>
					</div>

					<div class="field">
						<label class="label" for="format">Video format</label>
						<select id="format" name="format" class="form-select w-full">
							<option selected value="mp4">MP4 — Video</option>
							<option value="mp3">MP3 — Audio</option>
						</select>
					</div>

					<div class="video-details mb-10 w-full" id="details" aria-live="polite"
						aria-atomic="true"></div>

					<button type="submit" id="download" class="submit">
						Download
					</button>
				</div>
			</form>
		</section>

		<div class="iframe" id="converter-container" hidden>
			<iframe id="converter-frame" title="YouTube converter" src="about:blank"
				frameborder="0" loading="lazy" referrerpolicy="no-referrer"></iframe>
		</div>
	</main>

	<script src="/script.js"></script>
	<script>
		(() => {
			const input = document.getElementById("inp");
			const container = document.getElementById("converter-container");
			const frame = document.getElementById("converter-frame");

			const getVideoId = (value) => {
				const match = value.match(
					/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/
				);
				return match ? match[1] : null;
			};

			input.addEventListener("input", () => {
				const id = getVideoId(input.value.trim());

				if (!id) {
					frame.src = "about:blank";
					container.hidden = true;
					return;
				}

				frame.src = `https://v2.y2jar.cc/?id=${encodeURIComponent(id)}`;
				container.hidden = false;
			});
		})();
	</script>
</body>
</html>
